<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biología Celular, Molecular y Bioquímica — Guía de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --surface-soft: #EFEFEA;
    --text: #1D1D1F; --text-soft: #6E6E73; --line: #E5E5E0;
    --primary: #2F6B4F; --primary-soft: #E3EFE7; --primary-strong: #1F5138;
    --amber: #B8863A; --amber-soft: #F3E6CE;
    --wrong: #A8453B; --wrong-soft: #F5DEDB;
    --fs-body: 13.7px; --fs-term: 21px; --fs-def: 15px; --fs-qq: 15.5px; --fs-opt: 14px;
  }
  :root[data-tsize="0"] { --fs-body: 12.2px; --fs-term: 19px; --fs-def: 13.5px; --fs-qq: 14px; --fs-opt: 13px; }
  :root[data-tsize="2"] { --fs-body: 15.8px; --fs-term: 24px; --fs-def: 17px; --fs-qq: 18px; --fs-opt: 16px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121412; --surface: #1C1F1C; --surface-soft: #23261F;
      --text: #EDEDEA; --text-soft: #A3A39D; --line: #34372F;
      --primary: #6FBF9B; --primary-soft: #21362B; --primary-strong: #B6E6CC;
      --amber: #D9AE68; --amber-soft: #3A2E18;
      --wrong: #E08579; --wrong-soft: #3A211E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121412; --surface: #1C1F1C; --surface-soft: #23261F;
    --text: #EDEDEA; --text-soft: #A3A39D; --line: #34372F;
    --primary: #6FBF9B; --primary-soft: #21362B; --primary-strong: #B6E6CC;
    --amber: #D9AE68; --amber-soft: #3A2E18;
    --wrong: #E08579; --wrong-soft: #3A211E;
  }
  @media (min-width: 860px) {
    .app { max-width: 880px; }
    details.topic .body { font-size: calc(var(--fs-body) + 1px); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  h1, h2, h3 { font-family: 'Manrope', system-ui, sans-serif; font-weight: 700; margin: 0; }
  .app { max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }
  header.top { position: sticky; top: 0; top: env(safe-area-inset-top, 0px); background: var(--bg);
    z-index: 10; padding: 18px 0 10px; border-bottom: 1px solid var(--line); }
  header.top .eyebrow { color: var(--primary); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  header.top h1 { font-size: 21px; line-height: 1.25; margin-top: 2px; color: var(--text); }
  header.top p.sub { color: var(--text-soft); font-size: 13px; margin: 4px 0 0; }
  nav.tabs { display: flex; gap: 6px; margin-top: 14px; background: var(--surface-soft); border-radius: 12px; padding: 4px; }
  nav.tabs button { flex: 1; border: none; background: transparent; color: var(--text-soft); font-family: inherit;
    font-size: 13.5px; font-weight: 600; padding: 9px 4px; border-radius: 9px; cursor: pointer; transition: background .15s ease, color .15s ease; }
  nav.tabs button.active { background: var(--surface); color: var(--primary-strong); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  section.view { display: none; padding-top: 18px; } section.view.active { display: block; }

  details.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  details.topic summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
  details.topic summary::-webkit-details-marker { display: none; }
  details.topic summary .num { color: var(--primary); font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14.5px; min-width: 22px; }
  details.topic summary::after { content: '+'; margin-left: auto; color: var(--text-soft); font-size: 18px; font-weight: 400; }
  details.topic[open] summary::after { content: '\2013'; }
  details.topic .body { padding: 0 16px 16px 44px; color: var(--text-soft); font-family: 'Literata', Georgia, serif; font-size: var(--fs-body); line-height: 1.65; }
  details.topic .body ul { margin: 6px 0; padding-left: 18px; } details.topic .body li { margin-bottom: 5px; }
  details.topic .body strong { color: var(--text); }

  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar select, .toolbar button.pill {
    border:1px solid var(--line); background:var(--surface); color:var(--text); font-family:inherit;
    font-size:13px; font-weight:600; padding:8px 12px; border-radius:10px; }

  .card-wrap { padding-top: 4px; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; color: var(--text-soft); font-size: 12.5px; margin-bottom: 10px; }
  .flashcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-height: 220px;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 26px 18px; cursor: pointer; position: relative; }
  .flashcard .tag { position: absolute; top: 14px; left: 16px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); font-weight: 700; }
  .flashcard .cat { position:absolute; top:14px; right:16px; font-size:10.5px; color: var(--text-soft); background:var(--surface-soft); padding:3px 8px; border-radius:20px; }
  .flashcard .term { font-family: 'Literata', Georgia, serif; font-size: var(--fs-term); color: var(--text); }
  .flashcard .def { font-family: 'Literata', Georgia, serif; font-size: var(--fs-def); color: var(--text-soft); line-height: 1.55; }
  .flashcard .hint { position: absolute; bottom: 12px; font-size: 11px; color: var(--text-soft); opacity: .7; }
  .card-controls { display: flex; gap: 10px; margin-top: 14px; }
  .card-controls button { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .card-controls button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

  .quiz-progress { color: var(--text-soft); font-size: 13px; margin-bottom: 10px; }
  .quiz-q { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .quiz-q h3 { font-size: var(--fs-qq); line-height: 1.45; margin-bottom: 14px; font-family:'Literata', Georgia, serif; font-weight:600; }
  .opt { display: block; width: 100%; text-align: left; background: var(--surface-soft); border: 1px solid var(--line);
    border-radius: 11px; padding: 12px 14px; margin-bottom: 8px; font-family: 'Literata', Georgia, serif; font-size: var(--fs-opt); color: var(--text); cursor: pointer; }
  .opt.correct { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-strong); font-weight: 600; }
  .opt.wrong { background: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong); font-weight: 600; }
  .opt[disabled] { cursor: default; }
  .explain { margin-top: 10px; padding: 12px 14px; background: var(--amber-soft); border-radius: 11px; font-size: 13.3px; color: var(--text); line-height: 1.5; display: none; }
  .explain.show { display: block; }
  .quiz-next { margin-top: 14px; width: 100%; padding: 13px; border-radius: 12px; border: none; background: var(--primary);
    color: #fff; font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; display: none; }
  .quiz-next.show { display: block; }
  .quiz-result { text-align: center; padding: 30px 16px; }
  .quiz-result .score { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 42px; color: var(--primary); margin: 10px 0; }
  .quiz-result p { color: var(--text-soft); font-size: 14.3px; }
  .quiz-result button, .quiz-start button { margin-top: 14px; padding: 12px 22px; border-radius: 12px; border: none;
    background: var(--primary); color: #fff; font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; }
  .quiz-start { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; text-align:center; }
  .quiz-start p { color: var(--text-soft); font-size: 13.7px; margin: 8px 0 14px; }

  footer.note { text-align: center; color: var(--text-soft); font-size: 12px; margin-top: 26px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="eyebrow">UCV · Escuela de Medicina</div>
    <h1>Biología Celular, Molecular y Bioquímica</h1>
    <p class="sub">Resumen, tarjetas y 500 preguntas — todas las sesiones y casos clínicos</p>
    <div style="display:flex; align-items:center; gap:8px; margin-top:12px;">
      <nav class="tabs" style="flex-grow:1; margin-top:0;">
        <button class="tab-btn active" data-view="resumen">Resumen</button>
        <button class="tab-btn" data-view="cards">Tarjetas</button>
        <button class="tab-btn" data-view="quiz">Quiz</button>
      </nav>
      <button id="font-size-btn" aria-label="Cambiar tamaño de texto" title="Cambiar tamaño de texto"
        style="flex-shrink:0; height:38px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; cursor:pointer;">Aa</button>
      <button id="theme-btn" aria-label="Cambiar modo claro/oscuro" title="Cambiar modo claro/oscuro"
        style="flex-shrink:0; width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;"></button>
    </div>
  </header>

  <section class="view active" id="view-resumen">
    <div id="topics"></div>
  </section>

  <section class="view" id="view-cards">
    <div class="card-wrap">
      <div class="progress-row"><span id="card-count"></span><span id="card-cat"></span></div>
      <div class="flashcard" id="flashcard">
        <span class="tag" id="card-side-tag">TÉRMINO</span>
        <span class="cat" id="card-cat-badge"></span>
        <div class="term" id="card-front"></div>
        <div class="def" id="card-back" style="display:none;"></div>
        <span class="hint">toca para voltear</span>
      </div>
      <div class="card-controls">
        <button id="card-prev">← Anterior</button>
        <button id="card-shuffle">Aleatorio</button>
        <button id="card-next" class="primary">Siguiente →</button>
      </div>
    </div>
  </section>

  <section class="view" id="view-quiz">
    <div id="quiz-area"></div>
  </section>

  <footer class="note">Repasa las veces que quieras — nada se envía ni se guarda fuera de este dispositivo.</footer>
</div>

<script id="content-data" type="application/json">{"topics": [{"title": "Bioelementos y biomoléculas", "body": "\n<ul>\n<li><strong>Bioelementos primarios:</strong> C, H, O, N, P, S — forman el 95-99% de la materia viva.</li>\n<li><strong>Bioelementos secundarios:</strong> Ca, Na, K, Cl, Mg (≈2,5%). <strong>Oligoelementos:</strong> Fe, Zn, Cu, Mn, I, Co, Mo (trazas, &lt;0,5%).</li>\n<li><strong>Agua:</strong> molécula polar, forma puentes de hidrógeno; alto calor específico y de vaporización; disolvente universal; da tensión superficial.</li>\n<li><strong>pH:</strong> escala logarítmica; pH=7 neutro, [H+]=10⁻⁷ M. Sistemas tampón (bicarbonato/ácido carbónico, fosfato) mantienen el pH intra y extracelular (~7,4 y ~6,86 respectivamente).</li>\n<li><strong>Glúcidos:</strong> reserva energética (almidón, glucógeno) y estructural (celulosa, quitina).</li>\n<li><strong>Lípidos:</strong> insolubles en agua; triglicéridos (reserva), fosfolípidos (membranas, anfipáticos), esteroides (colesterol, hormonas), ceras (impermeabilización). Saturados = sólidos; insaturados = líquidos.</li>\n<li><strong>Proteínas:</strong> monómero = aminoácido. Funciones: enzimática, hormonal, estructural (colágeno), transporte (albúmina), defensa (anticuerpos), contráctil (actina).</li>\n<li><strong>Niveles estructurales de proteínas:</strong> primaria (secuencia de aminoácidos), secundaria (plegamiento por puentes H, hélice α/lámina β), terciaria (plegamiento 3D por cadenas laterales), cuaternaria (más de una cadena polipeptídica).</li>\n<li><strong>Caso clínico:</strong> la hipoproteinemia (albúmina baja) causa edema, mala cicatrización; el déficit de ácidos grasos esenciales altera la fluidez de membrana; la falta de queratina/colágeno da piel seca y cabello quebradizo.</li>\n</ul>"}, {"title": "Los seres vivos", "body": "\n<ul>\n<li><strong>Ser vivo:</strong> sistema organizado capaz de homeostasis, metabolismo, crecimiento, respuesta a estímulos, reproducción y evolución por selección natural.</li>\n<li><strong>Tres dominios:</strong> Bacteria y Archaea (procariotas) y Eukarya (eucariotas: animales, plantas, hongos, protistas).</li>\n<li><strong>Virus, viroides y priones:</strong> no se consideran seres vivos estrictos (sin metabolismo propio / dependen del hospedero).</li>\n<li><strong>Características de los seres vivos:</strong> organización, metabolismo, homeostasis, movimiento, irritabilidad, crecimiento, reproducción, adaptación evolutiva.</li>\n<li><strong>Niveles de organización biológica:</strong> célula → tejido → órgano → sistema de órganos → organismo → población → comunidad → ecosistema → bioma → biosfera.</li>\n<li><strong>Metabolismo:</strong> catabolismo (degradación, libera energía) + anabolismo (síntesis, consume energía).</li>\n</ul>"}, {"title": "Teoría celular y tipos de células", "body": "\n<ul>\n<li><strong>Postulados:</strong> Schleiden y Schwann (1838-39): la célula es la unidad estructural y fisiológica. Virchow (1855): \"Omnis cellula e cellula\" (toda célula proviene de otra). Sutton/Boveri: la célula es la unidad genética.</li>\n<li><strong>Pioneros:</strong> Robert Hooke (1665, observó células en corcho), Anton van Leeuwenhoek (describió microorganismos).</li>\n<li><strong>Propiedades de la célula:</strong> alta organización, programa genético (ADN), diversidad de reacciones químicas (enzimas), captación/transformación de energía (ATP), procesos mecánicos (citoesqueleto), respuesta a estímulos, homeostasis.</li>\n<li><strong>Célula procariota:</strong> sin núcleo definido, ADN libre en el nucleoide, sin organelos membranosos, se reproduce por fisión binaria.</li>\n<li><strong>Célula eucariota:</strong> núcleo verdadero con carioteca, ADN lineal con histonas, organelos membranosos; se reproduce por mitosis o meiosis.</li>\n<li><strong>Célula vegetal vs animal:</strong> vegetal tiene pared celular (celulosa), cloroplastos, vacuola central grande, almacena almidón, tiene plasmodesmos; animal tiene centriolos, lisosomas comunes, almacena glucógeno, sin pared ni cloroplastos.</li>\n<li><strong>Células especializadas:</strong> mismo ADN, distintos genes activos → tejidos: epitelial (protección/absorción), conectivo (sostén), muscular (movimiento), nervioso (impulsos).</li>\n</ul>"}, {"title": "Membrana plasmática y transporte", "body": "\n<ul>\n<li><strong>Estructura:</strong> bicapa de fosfolípidos con colesterol, proteínas integrales y periféricas, y glicocálix (glicoproteínas/glicolípidos) en la cara externa.</li>\n<li><strong>Difusión simple:</strong> paso directo y pasivo a favor de gradiente, sin gasto de ATP (ej. O₂ del alvéolo a la sangre).</li>\n<li><strong>Difusión facilitada:</strong> mediante canal o proteína transportadora, sin ATP, saturable (ej. GLUT1 para glucosa).</li>\n<li><strong>Ósmosis:</strong> movimiento neto de agua hacia donde hay más soluto.</li>\n<li><strong>Transporte activo primario:</strong> usa ATP directamente contra gradiente (ej. bomba Na⁺/K⁺-ATPasa: 3 Na⁺ fuera, 2 K⁺ dentro).</li>\n<li><strong>Transporte activo secundario:</strong> usa la energía de un gradiente ya creado (simporte SGLT-1: Na⁺+glucosa; antiporte Na⁺/Ca²⁺).</li>\n<li><strong>Transporte vesicular:</strong> endocitosis (entrada) y exocitosis (salida), con gasto de energía.</li>\n<li><strong>Aplicación clínica (cólera):</strong> la toxina colérica activa de forma permanente el canal CFTR → salida masiva de Cl⁻, Na⁺ y agua → diarrea secretora \"en agua de arroz\" y deshidratación. Las sales de rehidratación oral (SRO) aprovechan el cotransportador SGLT-1 (Na⁺+glucosa) para rehidratar.</li>\n</ul>"}, {"title": "Sistema de endomembranas: RE y Golgi", "body": "\n<ul>\n<li><strong>Envoltura nuclear:</strong> delimita el núcleo, se continúa con el RE, tiene poros nucleares.</li>\n<li><strong>RE rugoso (RER):</strong> tiene ribosomas adosados; sintetiza proteínas de secreción, de membrana y lisosomales. El péptido señal es reconocido por la SRP.</li>\n<li><strong>RE liso (REL):</strong> sin ribosomas; sintetiza lípidos y esteroides, detoxifica fármacos (citocromo P450 en hepatocitos), almacena Ca²⁺ (retículo sarcoplásmico en músculo), interviene en la glucogenólisis (glucosa-6-fosfatasa).</li>\n<li><strong>Aparato de Golgi:</strong> pilas de cisternas (dictiosomas) con cara cis (recibe del RE vía ERGIC) y cara trans (TGN, empaqueta hacia destinos). Modifica proteínas (glicosilación, sulfatación, fosforilación), las clasifica y empaqueta en vesículas.</li>\n<li><strong>Enfermedades del RE/Golgi:</strong> plegamiento proteico defectuoso (Alzheimer, Parkinson, fibrosis quística); errores de glicosilación (CDG); Golgi fragmentado en neurodegeneración; síndrome de células I (mucolipidosis II) por fallo en marcaje con manosa-6-fosfato.</li>\n</ul>"}, {"title": "Lisosomas, endosomas y peroxisomas", "body": "\n<ul>\n<li><strong>Lisosomas:</strong> vesículas ~100-150 nm, pH ácido (~5) gracias a la bomba de protones v-ATPasa; contienen hidrolasas ácidas. Poblaciones perinucleares (más ácidas, degradación) y periféricas (reparación de membrana, sensan nutrientes vía mTORC1).</li>\n<li><strong>Marcaje manosa-6-fosfato:</strong> el Golgi etiqueta las enzimas lisosomales para dirigirlas correctamente al lisosoma.</li>\n<li><strong>Enfermedad de Tay-Sachs:</strong> deficiencia de hexosaminidasa A → no se degrada el gangliósido GM2 → se acumula en neuronas → retraso psicomotor, hipotonía, pérdida de visión y audición.</li>\n<li><strong>Otras enfermedades lisosomales:</strong> Niemann-Pick, mucopolisacaridosis.</li>\n<li><strong>Peroxisomas:</strong> una sola membrana, sin ADN ni ribosomas propios; oxidan ácidos grasos de cadena muy larga y producen H₂O₂, que la catalasa convierte en H₂O y O₂.</li>\n<li><strong>Endosomas:</strong> clasifican el material internalizado por endocitosis, dirigiéndolo a reciclaje o a lisosomas para degradación.</li>\n</ul>"}, {"title": "Mitocondria y núcleo/nucléolo", "body": "\n<ul>\n<li><strong>Mitocondria:</strong> doble membrana, produce ATP por fosforilación oxidativa; tiene su propio ADN circular y ribosomas 70S; su número y dinámica (fusión/fisión) varían según la demanda energética.</li>\n<li><strong>Núcleo:</strong> contiene el ADN organizado en cromatina; delimitado por la carioteca (continua con el RE) con poros nucleares para el intercambio con el citoplasma.</li>\n<li><strong>Nucléolo:</strong> región nuclear donde se sintetiza el ARNr y se ensamblan las subunidades ribosómicas.</li>\n</ul>"}, {"title": "Uniones intercelulares y matriz extracelular", "body": "\n<ul>\n<li><strong>Uniones estrechas (ocluyentes):</strong> sellan el espacio entre células epiteliales, impiden el paso de sustancias entre ellas.</li>\n<li><strong>Uniones adherentes (desmosomas, cadherinas):</strong> anclan células entre sí mediante filamentos, dan resistencia mecánica al tejido.</li>\n<li><strong>Uniones comunicantes (gap junctions, conexinas):</strong> canales que permiten el paso directo de iones y pequeñas moléculas entre células vecinas.</li>\n<li><strong>Hemidesmosomas e integrinas:</strong> anclan la célula a la matriz extracelular (adhesión célula-matriz).</li>\n<li><strong>Matriz extracelular (MEC):</strong> red de proteínas y polisacáridos secretada por las células; incluye colágeno, la lámina basal y proteoglicanos. El motivo RGD de proteínas como la fibronectina es reconocido por integrinas.</li>\n</ul>"}, {"title": "Ciclo celular: interfase y control", "body": "\n<ul>\n<li><strong>Interfase:</strong> G1 (crecimiento, síntesis de proteínas y orgánulos; el más variable, puede durar horas a años), S (duplicación del ADN, 2n→4c), G2 (crecimiento final, corrige errores de la replicación).</li>\n<li><strong>G0:</strong> estado de quiescencia; típico de neuronas y eritrocitos (no se dividen); algunas células como los hepatocitos pueden reingresar al ciclo.</li>\n<li><strong>Ejemplo numérico:</strong> en una célula de mamífero con ciclo de 16 h: G1=5h, S=7h, G2=3h, M=1h.</li>\n<li><strong>Puntos de control:</strong> G1 (o de inicio, decide si se divide), G2 (verifica que el ADN se replicó y reparó), metafase (verifica alineación cromosómica).</li>\n<li><strong>Ciclinas y CDK:</strong> las ciclinas activan a las quinasas dependientes de ciclina (CDK) fosforilando proteínas clave. Ciclina G1 (D) + CDK4/6 → paso G1→S; ciclina G1/S (E) + CDK2; ciclina S (A) + CDK2; ciclina mitótica (B) + CDK1 → factor promotor de la mitosis (FPM/MPF).</li>\n<li><strong>Genes reguladores:</strong> protooncogenes (aceleran el ciclo; su forma alterada = oncogén) y genes supresores de tumores / genes de verificación (chk), como p53, que frenan el ciclo o inducen apoptosis si el ADN está dañado.</li>\n<li><strong>Cáncer:</strong> acumulación de mutaciones en protooncogenes y supresores tumorales; tumor benigno (no invade, bien delimitado) vs maligno (invade, metastatiza).</li>\n</ul>"}, {"title": "Muerte celular: apoptosis y necrosis", "body": "\n<ul>\n<li><strong>Necrosis:</strong> muerte accidental por daño físico/químico; hay tumefacción, rotura de membrana y respuesta inflamatoria intensa.</li>\n<li><strong>Apoptosis:</strong> muerte celular programada; fragmentación del ADN, reducción del volumen celular, pérdida de función mitocondrial (liberación de citocromo c), formación de cuerpos apoptóticos eliminados por fagocitos sin inflamación. Es ~20 veces más rápida que la mitosis.</li>\n<li><strong>Caspasas:</strong> enzimas proteolíticas que ejecutan el desmantelamiento de la célula en apoptosis.</li>\n<li><strong>p53:</strong> detecta daño en el ADN antes de la fase S; puede inducir reparación, senescencia o apoptosis.</li>\n</ul>"}, {"title": "Mitosis", "body": "\n<ul>\n<li><strong>Profase:</strong> los cromosomas se condensan, se forma el huso mitótico, se desintegra el nucléolo y la envoltura nuclear.</li>\n<li><strong>Metafase:</strong> los cromosomas se alinean en el plano ecuatorial; las fibras del huso se unen a los cinetocoros.</li>\n<li><strong>Anafase:</strong> se parten los centrómeros y las cromátides hermanas (ahora cromosomas) migran a polos opuestos.</li>\n<li><strong>Telofase:</strong> los cromosomas se descondensan, se reorganiza la envoltura nuclear y reaparecen los nucléolos.</li>\n<li><strong>Citocinesis:</strong> división del citoplasma; en células animales por anillo contráctil de actina-miosina; en vegetales por fusión de vesículas de Golgi que forman la placa celular.</li>\n<li><strong>Resultado:</strong> dos células hijas diploides (2n) genéticamente idénticas entre sí y a la célula madre.</li>\n</ul>"}, {"title": "Meiosis y diversidad genética", "body": "\n<ul>\n<li><strong>Meiosis I (reduccional):</strong> los cromosomas homólogos se separan; en profase I ocurre el crossing-over (recombinación) entre cromátides no hermanas.</li>\n<li><strong>Rec8:</strong> cohesina meiótica; se cliva en los brazos durante anafase I (permitiendo separar homólogos) pero se protege en el centrómero hasta anafase II.</li>\n<li><strong>Meiosis II (ecuacional):</strong> similar a una mitosis; las cromátides hermanas se separan.</li>\n<li><strong>Resultado:</strong> 4 células haploides (n) genéticamente distintas entre sí.</li>\n<li><strong>Diversidad genética:</strong> la segregación al azar de cromosomas (2²³ combinaciones posibles en humanos) más el crossing-over generan la variabilidad de los gametos.</li>\n<li><strong>Mitosis vs meiosis:</strong> mitosis = 1 división, 2 células hijas 2n idénticas; meiosis = 2 divisiones, 4 células hijas n distintas entre sí y de la progenitora.</li>\n</ul>"}, {"title": "Comunicación y señalización celular", "body": "\n<ul>\n<li><strong>Señalización celular:</strong> proceso de recepción de una señal (ligando), transducción (cascada intracelular) y respuesta celular (genes, enzimas, división, apoptosis).</li>\n<li><strong>Tipos según distancia:</strong> yuxtacrina (contacto directo, ej. Delta-Notch), autocrina (la célula se señaliza a sí misma), paracrina (células vecinas, ej. FGF, Shh), endocrina (hormonas a distancia por sangre).</li>\n<li><strong>Tres clases de receptores de superficie:</strong> acoplados a canales iónicos, acoplados a enzimas (RTK), y acoplados a proteínas G (GPCR).</li>\n<li><strong>Proteínas G:</strong> interruptores moleculares; inactivas unidas a GDP, activas unidas a GTP; los GEF (como un GPCR activado) promueven el intercambio GDP→GTP; la actividad GTPasa intrínseca (reforzada por GAP/RGS) termina la señal.</li>\n<li><strong>Vía del AMPc:</strong> proteína G activa adenilato ciclasa → ATP→AMPc → activa la proteína quinasa A (PKA).</li>\n<li><strong>Vía del fosfoinosítido:</strong> proteína G activa fosfolipasa C-β (PLCβ) → hidroliza PIP2 → IP3 (libera Ca²⁺ del RE) + DAG (activa PKC).</li>\n<li><strong>Desensibilización:</strong> las GRK y arrestinas inactivan a los GPCR tras activación prolongada.</li>\n<li><strong>Segundos mensajeros:</strong> AMPc, IP3, Ca²⁺, GMPc (este último media la visión y el olfato).</li>\n</ul>"}, {"title": "Leyes de Mendel y cruces genéticos", "body": "\n<ul>\n<li><strong>1ª ley (uniformidad/dominancia):</strong> al cruzar dos homocigotos que difieren en un carácter, la F1 es uniforme (AA×aa → 100% Aa).</li>\n<li><strong>2ª ley (segregación):</strong> los alelos se separan al formar los gametos (Aa×Aa → 1AA:2Aa:1aa, fenotipos 3:1).</li>\n<li><strong>3ª ley (distribución independiente):</strong> los alelos de genes distintos se heredan independientemente (sin ligamiento); AaBb → gametos AB, Ab, aB, ab en 1:1:1:1.</li>\n<li><strong>Dominancia incompleta:</strong> el heterocigoto muestra un fenotipo intermedio (ej. flores C^RC^B rosadas).</li>\n<li><strong>Ejercicio ratones:</strong> bb (blanco) × Bb (negro) → 50% Bb, 50% bb.</li>\n<li><strong>Ejercicio AaBb × aabb:</strong> 4 genotipos distintos (AaBb, Aabb, aaBb, aabb), 25% cada uno.</li>\n</ul>"}, {"title": "Sistema ABO, Rh y herencia ligada al X", "body": "\n<ul>\n<li><strong>Grupo A</strong> (I^A I^A o I^A i), <strong>grupo B</strong> (I^B I^B o I^B i), <strong>grupo AB</strong> (I^A I^B, sin anticuerpos, receptor universal), <strong>grupo O</strong> (ii, dona glóbulos a todos).</li>\n<li><strong>Factor Rh:</strong> Rh+ = DD o Dd (presenta antígeno D); Rh- = dd (puede sensibilizarse tras exposición, relevante en el embarazo).</li>\n<li><strong>Determinación de paternidad con ABO:</strong> solo permite excluir, nunca confirmar con certeza (se requiere ADN).</li>\n<li><strong>Herencia ligada al X (daltonismo, hemofilia):</strong> los hombres (XY) se afectan con un solo alelo recesivo; las mujeres (XX) necesitan dos para estar afectadas, con uno son portadoras.</li>\n<li><strong>Ejemplo:</strong> madre portadora × padre normal → hijos varones 50% afectados; hijas 50% portadoras, 0% afectadas.</li>\n</ul>"}, {"title": "Gametogénesis", "body": "\n<ul>\n<li><strong>Cuatro fases:</strong> 1) origen y migración de células germinales primordiales (CGP), 2) proliferación mitótica, 3) reducción cromosómica (meiosis), 4) maduración estructural y funcional.</li>\n<li><strong>CGP:</strong> se originan en el saco vitelino (~24 días post-fecundación) y migran vía intestino primitivo posterior y mesenterio dorsal hasta las gónadas. Si se extravían pueden formar teratomas (piel, cartílago, dientes).</li>\n<li><strong>Espermatogénesis:</strong> continua desde la pubertad (~64 días); 1 espermatocito primario → 4 espermátidas haploides. Espermiogénesis: condensación del ADN (histonas→protaminas), formación del acrosoma (Golgi), flagelo (mitocondrias), eliminación de citoplasma.</li>\n<li><strong>Ovogénesis:</strong> inicia en la vida fetal; pico de ~7 millones de ovogonias en el 5º mes fetal, luego atresia continua. Proceso con doble bloqueo meiótico (diplotene fetal, metafase II) y división asimétrica (óvulo + corpúsculos polares).</li>\n<li><strong>Células de Sertoli:</strong> dan soporte y nutrición a las células espermáticas (1 por cada 30-50 células); forman la barrera hematotesticular.</li>\n</ul>"}, {"title": "Trisomía 21 (síndrome de Down)", "body": "\n<ul>\n<li><strong>Causa:</strong> no disyunción meiótica o mitótica del cromosoma 21 → cigoto con 47 cromosomas (trisomía 21, 2n+1).</li>\n<li><strong>Mecanismos citogenéticos:</strong> trisomía 21 completa (95% de casos), mosaicismo, translocación (puede ser familiar).</li>\n<li><strong>Diagnóstico:</strong> cariotipo — mapeo fotográfico de cromosomas en metafase.</li>\n<li><strong>Fenotipo:</strong> puente nasal plano, ojos almendrados, cuello corto, talla baja, pliegue palmar único, hipotonía, retraso psicomotor.</li>\n<li><strong>Principal factor de riesgo:</strong> edad materna avanzada (≥35 años) — a los 40 años el riesgo es 16 veces mayor que a los 25.</li>\n<li><strong>Otros factores de riesgo descritos:</strong> nivel socioeconómico bajo, ocupación materna con exposición a solventes, obesidad materna, consanguinidad, acortamiento de telómeros maternos, polimorfismos MTHFR 677C&gt;T y RFC1 80A&gt;G.</li>\n<li><strong>Factor protector:</strong> uso prolongado de anticonceptivos orales antes del embarazo (menos ciclos ovulatorios).</li>\n<li><strong>Manejo actual:</strong> no existe tratamiento curativo; manejo paliativo integral (terapias física, ocupacional, del habla). La edición génica con CRISPR-Cas9 es experimental.</li>\n</ul>"}, {"title": "Caso clínico: cólera (Vibrio cholerae)", "body": "\n<ul>\n<li><strong>Vibrio cholerae:</strong> célula procariota Gram negativa en forma de coma; usa flagelo (movilidad) y pili TCP (adhesión al epitelio intestinal).</li>\n<li><strong>Toxina colérica (AB5):</strong> se une al gangliósido GM1, se interna, y la subunidad A1 ADP-ribosila la proteína Gαs, que queda constitutivamente activa → ↑AMPc → activa PKA → fosforila y abre el canal CFTR.</li>\n<li><strong>Consecuencia:</strong> salida masiva de Cl⁻, arrastre de Na⁺ y agua → diarrea secretora \"en agua de arroz\", deshidratación, taquicardia compensatoria, calambres (por pérdida de K⁺) y posible acidosis metabólica (pérdida de HCO₃⁻).</li>\n<li><strong>Tratamiento:</strong> sales de rehidratación oral (SRO): NaCl, KCl, glucosa y citrato trisódico; la glucosa permite absorber Na⁺ y agua vía el cotransportador SGLT-1, independiente del AMPc.</li>\n</ul>"}], "flashcards": [["Bioelementos primarios", "C, H, O, N, P y S — forman el 95-99% de la materia viva.", "Bioquímica"], ["Bioelementos secundarios", "Ca, Na, K, Cl, Mg — forman alrededor del 2,5% de la materia viva.", "Bioquímica"], ["Oligoelementos", "Fe, Zn, Cu, Mn, I, Co, Mo — esenciales en trazas, menos del 0,5% de la masa.", "Bioquímica"], ["Puente de hidrógeno", "Enlace débil entre moléculas de agua que explica su elevado calor específico y tensión superficial.", "Bioquímica"], ["pH neutro", "Valor de pH = 7, donde [H+] = [OH-] = 10⁻⁷ mol/L.", "Bioquímica"], ["Sistema tampón bicarbonato", "Sistema que mantiene el pH extracelular en torno a 7,4 mediante el equilibrio ión bicarbonato/ácido carbónico.", "Bioquímica"], ["Triglicéridos", "Lípidos de reserva energética a largo plazo, formados por glicerol y ácidos grasos.", "Bioquímica"], ["Fosfolípidos", "Lípidos anfipáticos que forman la bicapa de las membranas biológicas.", "Bioquímica"], ["Esteroides", "Lípidos con estructura de 4 anillos de carbono, como el colesterol y las hormonas sexuales.", "Bioquímica"], ["Ácidos grasos insaturados", "Ácidos grasos con enlaces dobles, líquidos a temperatura ambiente (ej. aceites vegetales).", "Bioquímica"], ["Estructura primaria de una proteína", "Secuencia lineal de aminoácidos de la cadena polipeptídica.", "Bioquímica"], ["Estructura secundaria de una proteína", "Plegamiento regular (hélice α, lámina β) originado por puentes de hidrógeno del esqueleto peptídico.", "Bioquímica"], ["Estructura terciaria de una proteína", "Plegamiento tridimensional completo debido a interacciones entre cadenas laterales.", "Bioquímica"], ["Estructura cuaternaria de una proteína", "Asociación de más de una cadena polipeptídica en una sola proteína funcional.", "Bioquímica"], ["Albúmina", "Proteína de transporte plasmático; su déficit (hipoproteinemia) causa edema y mala cicatrización.", "Bioquímica"], ["Colágeno", "Proteína estructural fibrosa que da soporte a piel, huesos y tejido conjuntivo.", "Bioquímica"], ["Hidrolasas ácidas", "Enzimas degradativas de los lisosomas, activas a pH ácido (~5).", "Bioquímica"], ["Homeostasis", "Mantenimiento de condiciones internas estables pese a cambios externos, mediante retroalimentación.", "Seres vivos"], ["Dominio Bacteria", "Dominio de organismos procariotas sin núcleo ni orgánulos membranosos.", "Seres vivos"], ["Dominio Archaea", "Dominio de procariotas con bioquímica y genética distintas a las bacterias, muchas extremófilas.", "Seres vivos"], ["Dominio Eukarya", "Dominio que incluye a todos los organismos con núcleo y orgánulos membranosos.", "Seres vivos"], ["Catabolismo", "Conjunto de reacciones metabólicas de degradación que liberan energía.", "Seres vivos"], ["Anabolismo", "Conjunto de reacciones metabólicas de síntesis que consumen energía.", "Seres vivos"], ["Irritabilidad", "Capacidad de un ser vivo de percibir y responder a estímulos del ambiente.", "Seres vivos"], ["Virus", "Genoma de ADN o ARN que depende del hospedero para replicarse; carece de metabolismo propio.", "Seres vivos"], ["Teoría celular", "Principio que establece que la célula es la unidad estructural, funcional y genética de los seres vivos.", "Célula"], ["Robert Hooke", "Científico que observó por primera vez células, en tejido de corcho, en 1665.", "Célula"], ["Rudolf Virchow", "Científico que estableció que toda célula proviene de otra célula preexistente (\"Omnis cellula e cellula\").", "Célula"], ["Nucleoide", "Región del citoplasma bacteriano donde se localiza el ADN libre, sin envoltura nuclear.", "Célula"], ["Fisión binaria", "Modo de reproducción asexual de las células procariotas.", "Célula"], ["Carioteca", "Envoltura nuclear que delimita el núcleo y se continúa con el retículo endoplasmático.", "Célula"], ["Pared celular vegetal", "Cubierta rígida de celulosa que rodea a la célula vegetal, ausente en la célula animal.", "Célula"], ["Vacuola central", "Estructura grande y única que ocupa gran parte del citoplasma en la célula vegetal.", "Célula"], ["Centriolos", "Estructuras presentes en la célula animal que participan en la división celular; ausentes en la célula vegetal.", "Célula"], ["Plasmodesmos", "Canales de comunicación intercelular presentes en células vegetales, ausentes en animales.", "Célula"], ["Difusión simple", "Transporte pasivo y directo de una sustancia a favor de su gradiente de concentración, sin proteína ni ATP.", "Membrana"], ["Difusión facilitada", "Transporte pasivo mediante un canal o proteína transportadora, sin gasto de ATP.", "Membrana"], ["Ósmosis", "Movimiento neto de agua a través de una membrana semipermeable hacia la zona de mayor concentración de soluto.", "Membrana"], ["Bomba Na+/K+-ATPasa", "Transporte activo primario que expulsa 3 Na+ e introduce 2 K+ por cada ATP hidrolizado.", "Membrana"], ["Cotransportador SGLT-1", "Transporte activo secundario tipo simporte que introduce Na+ y glucosa juntos.", "Membrana"], ["Endocitosis", "Proceso de transporte vesicular por el cual la célula incorpora sustancias del exterior.", "Membrana"], ["Exocitosis", "Proceso de transporte vesicular por el cual la célula libera sustancias al exterior.", "Membrana"], ["CFTR", "Canal de cloro de la membrana apical del enterocito; su apertura sostenida por la toxina colérica causa diarrea secretora.", "Membrana"], ["Glicocálix", "Capa de glicoproteínas y glicolípidos en la cara externa de la membrana plasmática.", "Membrana"], ["Retículo endoplasmático rugoso (RER)", "Dominio del RE con ribosomas asociados; sintetiza proteínas de secreción, membrana y lisosomales.", "Organelos"], ["Retículo endoplasmático liso (REL)", "Dominio del RE sin ribosomas; sintetiza lípidos, detoxifica fármacos y almacena Ca2+.", "Organelos"], ["Péptido señal", "Secuencia inicial de aminoácidos reconocida por la SRP que dirige la proteína naciente hacia el RE.", "Organelos"], ["SRP (partícula de reconocimiento de señal)", "Molécula que reconoce el péptido señal y frena la traducción hasta unirse a un receptor del RE.", "Organelos"], ["Dictiosoma", "Pila de cisternas aplanadas que constituye una unidad del aparato de Golgi.", "Organelos"], ["Cara cis del Golgi", "Dominio del aparato de Golgi que recibe material proveniente del retículo endoplasmático (vía ERGIC).", "Organelos"], ["Cara trans del Golgi (TGN)", "Dominio del aparato de Golgi donde las vesículas se empaquetan hacia sus destinos finales.", "Organelos"], ["ERGIC", "Compartimento intermedio retículo-Golgi formado por vesículas COPII que viajan del RE al Golgi.", "Organelos"], ["Manosa-6-fosfato", "Marcador molecular que el Golgi añade a las enzimas para dirigirlas correctamente al lisosoma.", "Organelos"], ["Síndrome de células I (mucolipidosis II)", "Enfermedad por fallo en el marcaje con manosa-6-fosfato; las enzimas lisosomales se secretan en vez de ir al lisosoma.", "Organelos"], ["v-ATPasa", "Bomba de protones que acidifica el interior del lisosoma (pH ~5).", "Organelos"], ["Lisosomas perinucleares", "Población de lisosomas más ácida, especializada en degradación y autofagia.", "Organelos"], ["Lisosomas periféricos", "Población de lisosomas relacionada con la reparación de membrana y la percepción de nutrientes vía mTORC1.", "Organelos"], ["Enfermedad de Tay-Sachs", "Enfermedad lisosomal por déficit de hexosaminidasa A, con acumulación del gangliósido GM2 en neuronas.", "Organelos"], ["Peroxisoma", "Orgánulo de una sola membrana que oxida ácidos grasos y produce H2O2, degradado luego por la catalasa.", "Organelos"], ["Catalasa", "Enzima peroxisomal que transforma el peróxido de hidrógeno (H2O2) en agua y oxígeno.", "Organelos"], ["Nucléolo", "Región nuclear donde se sintetiza el ARN ribosómico y se ensamblan las subunidades de los ribosomas.", "Organelos"], ["Mitocondria", "Orgánulo de doble membrana que pro  ciclo celular entre divisiones, donde ocurre la mayor actividad biosintética de la célula.", "Etapa de la interfase donde la célula verifica y corrige errores de la replicación antes de la mitosis.", "Punto de control que verifica que todos los cromosomas estén correctamente alineados antes de completar la división."], "correct": 2, "ex": "Punto de control de la metafase: Punto de control que verifica que todos los cromosomas estén correctamente alineados antes de completar la división."}, {"q": "(Bioquímica) “Molécula que lleva la información genética del ADN al ribosoma para la síntesis de proteínas.” ¿A qué concepto corresponde?", "opts": ["Cisteína y metionina", "ARN mensajero (ARNm)", "Disacárido"], "correct": 1, "ex": "ARN mensajero (ARNm): Molécula que lleva la información genética del ADN al ribosoma para la síntesis de proteínas."}, {"q": "(Célula) “Tejido que recubre superficies internas y externas; función de protección, absorción y secreción.” ¿A qué concepto corresponde?", "opts": ["Vacuola central", "Citoesqueleto", "Tejido epitelial"], "correct": 2, "ex": "Tejido epitelial: Tejido que recubre superficies internas y externas; función de protección, absorción y secreción."}, {"q": "(Mitosis) “Región organizadora de microtúbulos desde donde se origina el huso mitótico.” ¿A qué concepto corresponde?", "opts": ["Citocinesis en célula animal", "Centrosoma", "Profase (mitosis)"], "correct": 1, "ex": "Centrosoma: Región organizadora de microtúbulos desde donde se origina el huso mitótico."}, {"q": "(Síndrome de Down) ¿Cuál es la definición correcta de “Mosaicismo (trisomía 21)”?", "opts": ["Mecanismo en que solo algunas células del individuo tienen la copia extra del cromosoma 21.", "Manifestación neurológica frecuente del síndrome de Down.", "Mecanismo citogenético más frecuente (95%) del síndrome de Down: todas las células tienen un cromosoma 21 extra."], "correct": 0, "ex": "Mosaicismo (trisomía 21): Mecanismo en que solo algunas células del individuo tienen la copia extra del cromosoma 21."}, {"q": "(Bioquímica) “Lípidos anfipáticos que forman la bicapa de las membranas biológicas.” ¿A qué concepto corresponde?", "opts": ["Fosfolípidos", "Triglicéridos", "Colágeno"], "correct": 0, "ex": "Fosfolípidos: Lípidos anfipáticos que forman la bicapa de las membranas biológicas."}, {"q": "(Célula) “Tejido especializado en la transmisión de impulsos eléctricos; formado por neuronas y células gliales.” ¿A qué concepto corresponde?", "opts": ["Tejido nervioso", "Tejido muscular", "Robert Hooke"], "correct": 0, "ex": "Tejido nervioso: Tejido especializado en la transmisión de impulsos eléctricos; formado por neuronas y células gliales."}, {"q": "(Célula) ¿Cuál es la definición correcta de “Microtúbulos”?", "opts": ["Modo de reproducción asexual de las células procariotas.", "Cubierta rígida de celulosa que rodea a la célula vegetal, ausente en la célula animal.", "Componente del citoesqueleto formado por tubulina; forma el huso mitótico, cilios y flagelos."], "correct": 2, "ex": "Microtúbulos: Componente del citoesqueleto formado por tubulina; forma el huso mitótico, cilios y flagelos."}, {"q": "(Señalización) “Enzima activada por proteína G que hidroliza PIP2 en IP3 y DAG.” ¿A qué concepto corresponde?", "opts": ["Fosfolipasa C-β (PLCβ)", "Receptor tirosina quinasa (RTK)", "Segundo mensajero"], "correct": 0, "ex": "Fosfolipasa C-β (PLCβ): Enzima activada por proteína G que hidroliza PIP2 en IP3 y DAG."}, {"q": "(Bioquímica) ¿Cuál es la definición correcta de “Tensión superficial del agua”?", "opts": ["Propiedad debida a los puentes de hidrógeno entre moléculas de agua superficiales.", "Ácidos grasos sin enlaces dobles, sólidos a temperatura ambiente (ej. mantequilla).", "Nucleótido que almacena y transporta energía química utilizable por la célula."], "correct": 0, "ex": "Tensión superficial del agua: Propiedad debida a los puentes de hidrógeno entre moléculas de agua superficiales."}, {"q": "(Membrana) ¿Cuál es la definición s sales de rehidratación oral estándar."}, {"q": "(Membrana) ¿Cuál es la definición correcta de “Proteína integral de membrana”?", "opts": ["Canal de cloro de la membrana apical del enterocito; su apertura sostenida por la toxina colérica causa diarrea secretora.", "Proteína que atraviesa completamente la bicapa lipídica, como los canales y transportadores.", "Capa de glicoproteínas y glicolípidos en la cara externa de la membrana plasmática."], "correct": 1, "ex": "Proteína integral de membrana: Proteína que atraviesa completamente la bicapa lipídica, como los canales y transportadores."}, {"q": "(Síndrome de Down) ¿Cuál es la definición correcta de “Translocación robertsoniana (Down)”?", "opts": ["Mecanismo en que solo algunas células del individuo tienen la copia extra del cromosoma 21.", "Mecanismo citogenético del síndrome de Down que puede ser heredado de un progenitor portador balanceado.", "Manifestación neurológica frecuente del síndrome de Down."], "correct": 1, "ex": "Translocación robertsoniana (Down): Mecanismo citogenético del síndrome de Down que puede ser heredado de un progenitor portador balanceado."}, {"q": "(Bioquímica) “Plegamiento regular (hélice α, lámina β) originado por puentes de hidrógeno del esqueleto peptídico.” ¿A qué concepto corresponde?", "opts": ["Estructura secundaria de una proteína", "Enzima", "Albúmina"], "correct": 0, "ex": "Estructura secundaria de una proteína: Plegamiento regular (hélice α, lámina β) originado por puentes de hidrógeno del esqueleto peptídico."}, {"q": "(Seres vivos) “Dominio que incluye a todos los organismos con núcleo y orgánulos membranosos.” ¿A qué concepto corresponde?", "opts": ["Reproducción asexual", "Ecología", "Dominio Eukarya"], "correct": 2, "ex": "Dominio Eukarya: Dominio que incluye a todos los organismos con núcleo y orgánulos membranosos."}, {"q": "(Bioquímica) ¿Cuál es la definición correcta de “Fosfolípidos”?", "opts": ["Proteína estructural fibrosa que da soporte a piel, huesos y tejido conjuntivo.", "Lípidos anfipáticos que forman la bicapa de las membranas biológicas.", "Fe, Zn, Cu, Mn, I, Co, Mo — esenciales en trazas, menos del 0,5% de la masa."], "correct": 1, "ex": "Fosfolípidos: Lípidos anfipáticos que forman la bicapa de las membranas biológicas."}, {"q": "(Ciclo celular) ¿Cuál es la definición correcta de “Cdk4 y Cdk6”?", "opts": ["Período del ciclo celular entre divisiones, donde ocurre la mayor actividad biosintética de la célula.", "Masa localizada, bien delimitada, no invasiva ni metastásica.", "Quinasas dependientes de ciclina que interactúan con la ciclina D en la fase G1."], "correct": 2, "ex": "Cdk4 y Cdk6: Quinasas dependientes de ciclina que interactúan con la ciclina D en la fase G1."}, {"q": "(Uniones/MEC) ¿Cuál es la definición correcta de “Integrina”?", "opts": ["Capa de matriz extracelular que separa el epitelio del tejido conjuntivo subyacente.", "Glicoproteína de la matriz extracelular que contiene el motivo RGD reconocido por integrinas.", "Proteína de membrana que media la adhesión célula-matriz extracelular, reconociendo motivos como el RGD."], "correct": 2, "ex": "Integrina: Proteína de membrana que media la adhesión célula-matriz extracelular, reconociendo motivos como el RGD."}, {"q": "(Bioquímica) “Secuencia lineal de aminoácidos de la cadena polipeptídica.” ¿A qué concepto corresponde?", "opts": ["Colágeno", "Puente de hidrógeno", "Estructura primaria de una proteína"], "correct": 2, "ex": "Estructura primaria de una proteína: Secuencia lineal de aminoácidos de la cadena polipeptídica."}, {"q": "(Bioquímica) ¿Cuál es la definición correcta de “Fósforo (bioelemento)”?", "opts": ["Lípidos con estructura de 4 anillos de carbono, como el colesterol y las hormonas sexuales.", "Bioelemento presente en nucleótidos, ácidos nucleicos, ATP y fosfolípidos de membrana.", "Lípidos de reserva energética a largo plazo, formados por glicerol y ácidos grasos."], "correct": 1, "ex": "Fósforo (bioelemento): Bioelemento presente en nucl ?", "opts": ["Estructura de Vibrio cholerae (toxin-coregulated pilus) que favorece la colonización y adhesión al epitelio intestinal.", "Marcador de edad biológica materna; su acortamiento se asocia a mayor riesgo de no disyunción meiótica.", "Factor de riesgo asociado a mayor no disyunción del cromosoma 21 en la segunda división meiótica."], "correct": 0, "ex": "Pili TCP: Estructura de Vibrio cholerae (toxin-coregulated pilus) que favorece la colonización y adhesión al epitelio intestinal."}, {"q": "(Célula) “Componente del citoesqueleto implicado en la contracción muscular y el movimiento celular.” ¿A qué concepto corresponde?", "opts": ["Schleiden y Schwann", "Centriolos", "Microfilamentos de actina"], "correct": 2, "ex": "Microfilamentos de actina: Componente del citoesqueleto implicado en la contracción muscular y el movimiento celular."}, {"q": "(Genética) “Individuo con dos alelos diferentes para un gen determinado.” ¿A qué concepto corresponde?", "opts": ["Heterocigoto", "Genotipo", "Grupo sanguíneo O"], "correct": 0, "ex": "Heterocigoto: Individuo con dos alelos diferentes para un gen determinado."}, {"q": "(Membrana) “Capa de glicoproteínas y glicolípidos en la cara externa de la membrana plasmática.” ¿A qué concepto corresponde?", "opts": ["Difusión a través de canal saturable", "Colesterol de membrana", "Glicocálix"], "correct": 2, "ex": "Glicocálix: Capa de glicoproteínas y glicolípidos en la cara externa de la membrana plasmática."}, {"q": "(Membrana) ¿Cuál es la definición correcta de “Cotransportador SGLT-1”?", "opts": ["Proceso de transporte vesicular por el cual la célula libera sustancias al exterior.", "Proteína que atraviesa completamente la bicapa lipídica, como los canales y transportadores.", "Transporte activo secundario tipo simporte que introduce Na+ y glucosa juntos."], "correct": 2, "ex": "Cotransportador SGLT-1: Transporte activo secundario tipo simporte que introduce Na+ y glucosa juntos."}, {"q": "(Bioquímica) “Ácidos grasos sin enlac <script>
const CONTENT = JSON.parse(document.getElementById('content-data').textContent);
const topics = CONTENT.topics;
const flashcards = CONTENT.flashcards;
const ALL_QUIZ = CONTENT.quiz;

// ---------- RESUMEN ----------
const topicsEl = document.getElementById('topics');
topics.forEach((t, i) => {
  const d = document.createElement('details');
  d.className = 'topic';
  if (i === 0) d.open = true;
  d.innerHTML = `<summary><span class="num">${i+1}</span>${t.title}</summary><div class="body">${t.body}</div>`;
  topicsEl.appendChild(d);
});

// ---------- FONT SIZE ----------
const TSIZE_KEY = 'tsize';
let tsize = 1;
try { const saved = localStorage.getItem(TSIZE_KEY); if (saved !== null) tsize = parseInt(saved, 10); } catch (e) {}
function applyTsize() {
  document.documentElement.setAttribute('data-tsize', String(tsize));
}
applyTsize();
document.getElementById('font-size-btn').addEventListener('click', () => {
  tsize = (tsize + 1) % 3;
  applyTsize();
  try { localStorage.setItem(TSIZE_KEY, String(tsize)); } catch (e) {}
});

// ---------- THEME (light / dark) ----------
const THEME_KEY = 'theme';
const sunIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"></path></svg>';
const moonIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path></svg>';
const themeBtn = document.getElementById('theme-btn');
function currentTheme() {
  const saved = (() => { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } })();
  if (saved === 'light' || saved === 'dark') return saved;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(explicit) {
  const t = explicit || currentTheme();
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.innerHTML = t === 'dark' ? sunIcon : moonIcon;
}
applyTheme();
themeBtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
});

// ---------- TABS ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});

// ---------- FLASHCARDS ----------
let cardOrder = flashcards.map((_, i) => i);
let cardIdx = 0;
let flipped = false;
const cardFront = document.getElementById('card-front');
const cardBack = document.getElementById('card-back');
const cardCount = document.getElementById('card-count');
const cardCat = document.getElementById('card-cat');
const cardCatBadge = document.getElementById('card-cat-badge');
const cardSideTag = document.getElementById('card-side-tag');
const flashcardEl = document.getElementById('flashcard');

function renderCard() {
  const [term, def, cat] = flashcards[cardOrder[cardIdx]];
  cardFront.textContent = term;
  cardBack.textContent = def;
  cardCount.textContent = `Tarjeta ${cardIdx + 1} / ${flashcards.length}`;
  cardCatBadge.textContent = cat;
  cardCat.textContent = '';
  flipped = false;
  cardFront.style.display = 'block';
  cardBack.style.display = 'none';
  cardSideTag.textContent = 'TÉRMINO';
}
flashcardEl.addEventListener('click', () => {
  flipped = !flipped;
  cardFront.style.display = flipped ? 'none' : 'block';
  cardBack.style.display = flipped ? 'block' : 'none';
  cardSideTag.textContent = flipped ? 'DEFINICIÓN' : 'TÉRMINO';
});
document.getElementById('card-next').addEventListener('click', () => {
  cardIdx = (cardIdx + 1) % cardOrder.length; renderCard();
});
document.getElementById('card-prev').addEventListener('click', () => {
  cardIdx = (cardIdx - 1 + cardOrder.length) % cardOrder.length; renderCard();
});
document.getElementById('card-shuffle').addEventListener('click', () => {
  for (let i = cardOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
  }
  cardIdx = 0; renderCard();
});
renderCard();

// ---------- QUIZ ----------
let quiz = [];
let qIdx = 0;
let score = 0;
const quizArea = document.getElementById('quiz-area');

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStart() {
  quizArea.innerHTML = `
    <div class="quiz-start">
      <h3 style="margin-bottom:6px;">Banco de ${ALL_QUIZ.length} preguntas</h3>
      <p>Elige cuántas quieres para esta ronda. Se seleccionan al azar cada vez.</p>
      <div class="toolbar" style="justify-content:center;">
        <select id="quiz-len">
          <option value="15">15 preguntas</option>
          <option value="30" selected>30 preguntas</option>
          <option value="50">50 preguntas</option>
          <option value="100">100 preguntas</option>
          <option value="${ALL_QUIZ.length}">Todas (${ALL_QUIZ.length})</option>
        </select>
      </div>
      <button id="quiz-begin">Empezar</button>
    </div>`;
  document.getElementById('quiz-begin').addEventListener('click', () => {
    const n = parseInt(document.getElementById('quiz-len').value, 10);
    quiz = shuffleArr(ALL_QUIZ).slice(0, n);
    qIdx = 0; score = 0;
    renderQuiz();
  });
}

function renderQuiz() {
  if (qIdx >= quiz.length) {
    quizArea.innerHTML = `
      <div class="quiz-result">
        <div style="color:var(--text-soft);font-size:14px;">Puntaje final</div>
        <div class="score">${score} / ${quiz.length}</div>
        <p>${score === quiz.length ? '¡Perfecto!' : score >= quiz.length * 0.7 ? 'Muy bien, repasa lo que fallaste.' : 'Vale la pena repasar el resumen y las tarjetas otra vez.'}</p>
        <button id="quiz-restart">Otra ronda</button>
      </div>`;
    document.getElementById('quiz-restart').addEventListener('click', renderStart);
    return;
  }
  const item = quiz[qIdx];
  quizArea.innerHTML = `
    <div class="quiz-progress">Pregunta ${qIdx + 1} / ${quiz.length} · Aciertos: ${score}</div>
    <div class="quiz-q">
      <h3>${item.q}</h3>
      <div id="opts"></div>
      <div class="explain" id="explain">${item.ex}</div>
      <button class="quiz-next" id="quiz-next">${qIdx + 1 < quiz.length ? 'Siguiente' : 'Ver resultado'}</button>
    </div>`;
  const optsEl = document.getElementById('opts');
  item.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = opt;
    b.addEventListener('click', () => {
      document.querySelectorAll('.opt').forEach(o => o.disabled = true);
      if (i === item.correct) { b.classList.add('correct'); score++; }
      else { b.classList.add('wrong'); optsEl.children[item.correct].classList.add('correct'); }
      document.getElementById('explain').classList.add('show');
      document.getElementById('quiz-next').classList.add('show');
    });
    optsEl.appendChild(b);
  });
}
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'quiz-next') { qIdx++; renderQuiz(); }
});
renderStart();
</script>
</body>
</html>
